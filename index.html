<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ranking Brasileiro CBBT 2026</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#14213d;--mut:#5b6678;--line:#e1e6ee;--gold:#f2a900;--navy:#14213d;--ok:#1f9d55;--bad:#c53030}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:18px 16px 14px}
header h1{margin:0;font-size:1.25rem}
header p{margin:4px 0 0;color:#c9d2e3;font-size:.9rem}
.wrap{max-width:1100px;margin:0 auto;padding:12px 12px 40px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:10px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid #c5cdd9;background:#fff;color:var(--ink);padding:8px 14px;border-radius:999px;font-size:.9rem;font-weight:600;cursor:pointer}
.tab:hover{background:#eef1f6}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:1.05rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);background:#fafbfd}
td.l,th.l{text-align:left}
tr.top1 td.pos{color:var(--gold);font-weight:800}
.pts{font-weight:800}
.pos{font-weight:700}
.pos1{background:#fff4d1;font-weight:800}
.pos2{background:#eef1f6;font-weight:700}
.pos3{background:#fbe9dc;font-weight:700}
.adjp{color:var(--ok)}.adjn{color:var(--bad)}
.mut{color:var(--mut);font-size:.8rem}
button,select,input{font:inherit}
button{border:0;background:var(--navy);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer}
button.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.del{background:#fff;color:var(--bad);border:1px solid var(--line);padding:4px 10px}
select,input[type=text],input[type=number],input[type=email],input[type=password]{padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.item.dup{border-color:var(--bad);background:#fff5f5}
.warn{background:#fff8e1;border:1px solid #f2d27a;color:#6b4e00;padding:8px 12px;border-radius:8px;font-size:.88rem;margin-bottom:10px}
.status{font-size:.8rem;color:var(--mut)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-right:6px}
.dot.on{background:var(--ok)}
.hidden{display:none}
@media(max-width:600px){th,td{padding:7px 5px;font-size:.82rem}}
</style>
</head>
<body>
<header>
  <h1 id="titulo"></h1>
  <p id="subtitulo"></p>
</header>
<div class="wrap">
  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <div class="row" style="margin:0">
      <span class="status"><span class="dot" id="dot"></span><span id="conn">conectando…</span></span>
      <span id="authbox"></span>
    </div>
  </div>
  <div id="aviso"></div>
  <div id="v-ranking"></div>
  <div id="v-lanc" class="hidden"></div>
  <div id="v-adj" class="hidden"></div>
  <div id="v-bkp" class="hidden"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============ CONFIGURAÇÃO (edite aqui) ============ */
const CONFIG = {
  titulo: 'Campeonato Brasileiro CBBT 2026 — Federações',
  subtitulo: 'Ranking geral por equipes',
  // pontos por colocação: índice 0 = 1º lugar ... índice 13 = 14º lugar
  pontos: [100, 90, 80, 72, 65, 58, 52, 46, 40, 35, 30, 25, 20, 15],
  pontosProvisorio: true,            // mude para false quando usar a tabela oficial
  desempateCategoria: 'PRO',         // último critério de desempate: melhor colocação nesta categoria
  equipes: [
    {id:'CE', nome:'Ceará', sigla:'FECBT'},
    {id:'ES', nome:'Espírito Santo', sigla:'FECABT'},
    {id:'GO', nome:'Goiás', sigla:'FGOBT'},
    {id:'MA', nome:'Maranhão', sigla:'FBTM'},
    {id:'MG', nome:'Minas Gerais', sigla:'FMBT'},
    {id:'PA', nome:'Pará', sigla:'FEPABT'},
    {id:'PE', nome:'Pernambuco', sigla:'FPEBT'},
    {id:'RJ', nome:'Rio de Janeiro', sigla:'FRBT'},
    {id:'RN', nome:'Rio Grande do Norte', sigla:'FNBT'},
    {id:'RS', nome:'Rio Grande do Sul', sigla:'FGBT'},
    {id:'RR', nome:'Roraima', sigla:'FRBT'},
    {id:'SC', nome:'Santa Catarina', sigla:'FCBT'},
    {id:'SP', nome:'São Paulo', sigla:'FPBT'},
    {id:'TO', nome:'Tocantins', sigla:'FTOBT'}
  ],
  categorias: [
    {id:'PRO', nome:'Profissional'},
    {id:'A', nome:'A'}, {id:'B', nome:'B'}, {id:'C', nome:'C'}, {id:'D', nome:'D'},
    {id:'S12', nome:'Sub-12'}, {id:'S14', nome:'Sub-14'}, {id:'S16', nome:'Sub-16'}, {id:'S18', nome:'Sub-18'},
    {id:'M30', nome:'30+'}, {id:'M40', nome:'40+'}, {id:'M50', nome:'50+'}, {id:'M60', nome:'60+'}
  ],
  firebase: {
    apiKey: "AIzaSyAXyUflwWvC7cBiD-4How3hEJEX1I2bAZQ",
    authDomain: "brasileiro-cbbt-2026.firebaseapp.com",
    databaseURL: "https://brasileiro-cbbt-2026-default-rtdb.firebaseio.com",
    projectId: "brasileiro-cbbt-2026",
    storageBucket: "brasileiro-cbbt-2026.firebasestorage.app",
    messagingSenderId: "380210157106",
    appId: "1:380210157106:web:dbfb425d32bab95f73ce2b",
    measurementId: "G-YV38G5TGM6"
  }
};

/* ============ LÓGICA DE CÁLCULO (pura) ============ */
//LOGIC-START
function calcular(cfg, state, adj){
  const R = {};
  cfg.equipes.forEach(t => R[t.id] = {t, base:0, adj:0, c:[0,0,0], pro:99, cats:{}});
  cfg.categorias.forEach(c => {
    const cs = (state && state[c.id]) || {};
    Object.keys(cs).forEach(id => {
      const v = cs[id];
      if(!R[id] || !v || v.out || !v.pos) return;
      const p = Number(v.pos);
      R[id].base += cfg.pontos[p-1] || 0;
      R[id].cats[c.id] = p;
      if(p <= 3) R[id].c[p-1]++;
      if(c.id === cfg.desempateCategoria) R[id].pro = p;
    });
  });
  Object.values(adj || {}).forEach(a => {
    if(a && R[a.team]) R[a.team].adj += Number(a.pts) || 0;
  });
  const arr = Object.values(R);
  arr.forEach(r => r.total = r.base + r.adj);
  const key = r => [-r.total, -r.c[0], -r.c[1], -r.c[2], r.pro].join('|');
  arr.sort((a,b) => {
    const ka = [-a.total,-a.c[0],-a.c[1],-a.c[2],a.pro], kb = [-b.total,-b.c[0],-b.c[1],-b.c[2],b.pro];
    for(let i=0;i<ka.length;i++){ if(ka[i]!==kb[i]) return ka[i]-kb[i]; }
    return a.t.nome.localeCompare(b.t.nome,'pt-BR');
  });
  let last = null, lastRank = 0;
  arr.forEach((r,i) => {
    const k = key(r);
    if(k === last){ r.rank = lastRank; r.tie = true; } else { r.rank = i+1; lastRank = r.rank; last = k; }
  });
  return arr;
}
//LOGIC-END

/* ============ APP ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const teamById = id => CONFIG.equipes.find(t => t.id === id);
let state = {}, adj = {}, user = null, curTab = 'ranking', curCat = CONFIG.categorias[0].id;
let db = null, auth = null;

$('#titulo').textContent = CONFIG.titulo;
$('#subtitulo').textContent = CONFIG.subtitulo;
document.title = CONFIG.titulo;

function renderTabs(){
  const tabs = [['ranking','Ranking'],['quadro','Quadro por categoria']];
  if(user) tabs.push(['lanc','Lançamentos'],['adj','Bônus / Penalidades'],['bkp','Backup']);
  $('#tabs').innerHTML = tabs.map(([k,n]) => `<button class="tab ${curTab===k?'on':''}" data-t="${k}">${n}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { curTab = b.dataset.t; render(); });
}

function renderAuth(){
  if(user){
    $('#authbox').innerHTML = `<span class="status">${esc(user.email)}</span> <button class="sec" id="btnOut">Sair</button>`;
    $('#btnOut').onclick = () => auth.signOut();
  } else {
    $('#authbox').innerHTML = `<button class="sec" id="btnIn">Entrar para lançar</button>`;
    $('#btnIn').onclick = openLogin;
  }
}

function openLogin(){
  const box = $('#aviso');
  box.innerHTML = `<div class="card"><h2>Entrar</h2>
    <div class="row"><input type="email" id="lemail" placeholder="e-mail" autocomplete="username">
    <input type="password" id="lpass" placeholder="código / senha" autocomplete="current-password">
    <button id="lgo">Entrar</button><button class="sec" id="lcancel">Cancelar</button></div>
    <div class="mut" id="lerr"></div></div>`;
  $('#lcancel').onclick = renderAviso;
  const go = () => {
    $('#lerr').textContent = 'Entrando…';
    auth.signInWithEmailAndPassword($('#lemail').value.trim(), $('#lpass').value)
      .then(() => renderAviso())
      .catch(() => { $('#lerr').textContent = 'E-mail ou código incorreto.'; });
  };
  $('#lgo').onclick = go;
  $('#lpass').addEventListener('keydown', e => { if(e.key==='Enter') go(); });
  $('#lemail').focus();
}

function renderAviso(){
  $('#aviso').innerHTML = CONFIG.pontosProvisorio
    ? `<div class="warn"><b>Tabela de pontos provisória.</b> Os pontos exibidos ainda não seguem o regulamento oficial.</div>` : '';
}

function posCell(p){
  return p ? `<td class="pos${p<=3?p:''}">${p}º</td>` : `<td class="mut">–</td>`;
}

function renderRanking(){
  const rk = calcular(CONFIG, state, adj);
  const proNome = (CONFIG.categorias.find(c=>c.id===CONFIG.desempateCategoria)||{}).nome || '';
  let h = `<div class="card"><h2>Classificação geral</h2><div class="scroll"><table><thead><tr>
    <th>#</th><th class="l">Equipe</th><th>Pontos</th><th>Bônus/Pen.</th><th>Base</th><th>1º</th><th>2º</th><th>3º</th><th>${esc(proNome)}</th></tr></thead><tbody>`;
  rk.forEach(r => {
    const a = r.adj ? `<span class="${r.adj>0?'adjp':'adjn'}">${r.adj>0?'+':''}${r.adj}</span>` : '–';
    h += `<tr class="${r.rank===1&&r.total>0?'top1':''}"><td class="pos">${r.rank}º${r.tie?'<span class="mut">=</span>':''}</td>
      <td class="l"><b>${esc(r.t.nome)}</b> <span class="mut">${esc(r.t.sigla)}</span></td>
      <td class="pts">${r.total}</td><td>${a}</td><td>${r.base}</td>
      <td>${r.c[0]}</td><td>${r.c[1]}</td><td>${r.c[2]}</td><td>${r.pro<99?r.pro+'º':'–'}</td></tr>`;
  });
  h += `</tbody></table></div>
    <p class="mut">Desempate: mais 1º lugares, depois mais 2º, depois mais 3º, depois melhor colocação em ${esc(proNome)}. “=” indica empate total.</p></div>`;
  $('#v-ranking').innerHTML = h;
}

function renderQuadro(){
  const rk = calcular(CONFIG, state, adj);
  let h = `<div class="card"><h2>Colocação por categoria</h2><div class="scroll"><table><thead><tr><th class="l">Equipe</th>`;
  CONFIG.categorias.forEach(c => h += `<th>${esc(c.nome)}</th>`);
  h += `<th>Total</th></tr></thead><tbody>`;
  rk.forEach(r => {
    h += `<tr><td class="l"><b>${esc(r.t.nome)}</b></td>`;
    CONFIG.categorias.forEach(c => {
      const v = (state[c.id]||{})[r.t.id];
      if(v && v.out) h += `<td class="mut">n/p</td>`; else h += posCell(r.cats[c.id]);
    });
    h += `<td class="pts">${r.total}</td></tr>`;
  });
  h += `</tbody></table></div><p class="mut">“n/p” = não participa na categoria. “–” = ainda sem resultado.</p></div>`;
  $('#v-ranking').innerHTML = h;
}

function renderLanc(){
  const cat = CONFIG.categorias.find(c => c.id === curCat);
  const cs = state[curCat] || {};
  const used = {};
  Object.keys(cs).forEach(id => { if(cs[id] && cs[id].pos) used[cs[id].pos] = (used[cs[id].pos]||0)+1; });
  let h = `<div class="card"><h2>Lançar resultados</h2>
    <div class="row"><label>Categoria:</label><select id="selCat">${CONFIG.categorias.map(c=>`<option value="${c.id}" ${c.id===curCat?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></div>
    <div class="grid">`;
  CONFIG.equipes.forEach(t => {
    const v = cs[t.id] || {};
    const val = v.out ? 'out' : (v.pos ? String(v.pos) : '');
    const dup = v.pos && used[v.pos] > 1;
    let opts = `<option value="">—</option><option value="out" ${val==='out'?'selected':''}>Não participa</option>`;
    for(let i=1;i<=CONFIG.pontos.length;i++) opts += `<option value="${i}" ${val===String(i)?'selected':''}>${i}º</option>`;
    h += `<div class="item ${dup?'dup':''}"><span><b>${esc(t.nome)}</b> <span class="mut">${esc(t.sigla)}</span></span><select data-team="${t.id}">${opts}</select></div>`;
  });
  h += `</div><p class="mut">Cada colocação só pode ser usada uma vez por categoria. As alterações são salvas na hora e aparecem para todos.</p></div>`;
  $('#v-lanc').innerHTML = h;
  $('#selCat').onchange = e => { curCat = e.target.value; renderLanc(); };
  $('#v-lanc').querySelectorAll('select[data-team]').forEach(s => s.onchange = () => salvar(s.dataset.team, s.value));
}

function salvar(teamId, val){
  const ref = db.ref(`ranking/state/${curCat}/${teamId}`);
  if(val === ''){ ref.remove().catch(erroEscrita); return; }
  if(val === 'out'){ ref.set({out:true}).catch(erroEscrita); return; }
  const cs = state[curCat] || {};
  const clash = Object.keys(cs).find(id => id !== teamId && cs[id] && Number(cs[id].pos) === Number(val));
  if(clash){
    alert(`A colocação ${val}º já está com ${teamById(clash).nome} nesta categoria. Altere uma das duas.`);
    renderLanc(); return;
  }
  ref.set({pos:Number(val)}).catch(erroEscrita);
}
function erroEscrita(e){ alert('Não foi possível salvar. Verifique a conexão e se você está logado.'); console.error(e); renderLanc(); }

function renderAdj(){
  const list = Object.entries(adj).sort((a,b) => (b[1].ts||0)-(a[1].ts||0));
  let h = `<div class="card"><h2>Bônus e penalidades</h2>
    <div class="row">
      <select id="aTeam">${CONFIG.equipes.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('')}</select>
      <input type="number" id="aPts" placeholder="pontos (use - para penalidade)" style="width:240px">
      <input type="text" id="aMot" placeholder="motivo (obrigatório)" style="flex:1;min-width:200px">
      <button id="aAdd">Adicionar</button>
    </div>
    <div class="scroll"><table><thead><tr><th class="l">Equipe</th><th>Pontos</th><th class="l">Motivo</th><th>Por</th><th></th></tr></thead><tbody>`;
  if(!list.length) h += `<tr><td colspan="5" class="mut">Nenhum ajuste lançado.</td></tr>`;
  list.forEach(([k,a]) => {
    const t = teamById(a.team);
    h += `<tr><td class="l">${esc(t?t.nome:a.team)}</td><td class="${a.pts>=0?'adjp':'adjn'}">${a.pts>0?'+':''}${esc(a.pts)}</td>
      <td class="l">${esc(a.motivo)}</td><td class="mut">${esc(a.por||'')}</td><td><button class="del" data-k="${k}">Excluir</button></td></tr>`;
  });
  h += `</tbody></table></div></div>`;
  $('#v-adj').innerHTML = h;
  $('#aAdd').onclick = () => {
    const pts = Number($('#aPts').value), mot = $('#aMot').value.trim();
    if(!pts || !mot){ alert('Informe os pontos (diferentes de zero) e o motivo.'); return; }
    db.ref('ranking/adj').push({team:$('#aTeam').value, pts, motivo:mot, por:user.email, ts:Date.now()}).catch(erroEscrita);
  };
  $('#v-adj').querySelectorAll('.del').forEach(b => b.onclick = () => {
    if(confirm('Excluir este ajuste?')) db.ref('ranking/adj/'+b.dataset.k).remove().catch(erroEscrita);
  });
}

function renderBkp(){
  $('#v-bkp').innerHTML = `<div class="card"><h2>Backup e exportação</h2>
    <div class="row"><button id="bJson">Baixar backup (JSON)</button><button class="sec" id="bCsv">Exportar ranking (CSV)</button></div>
    <div class="row"><label class="mut">Restaurar backup (substitui os dados atuais):</label><input type="file" id="bFile" accept=".json"></div>
    <p class="mut">Baixe um backup ao fim de cada dia de competição e ao encerrar o campeonato.</p></div>`;
  $('#bJson').onclick = () => baixar(`backup_brasileiro_cbbt_2026_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify({ranking:{state, adj}}, null, 2), 'application/json');
  $('#bCsv').onclick = () => {
    const rk = calcular(CONFIG, state, adj);
    const head = ['Posição','Equipe','Sigla','Pontos','Bônus/Penalidade','Base','1º','2º','3º'].concat(CONFIG.categorias.map(c=>c.nome));
    const rows = rk.map(r => [r.rank, r.t.nome, r.t.sigla, r.total, r.adj, r.base, r.c[0], r.c[1], r.c[2]].concat(CONFIG.categorias.map(c => r.cats[c.id]||'')));
    const csv = [head].concat(rows).map(l => l.map(x => `"${String(x).replace(/"/g,'""')}"`).join(';')).join('\n');
    baixar('ranking_brasileiro_cbbt_2026.csv', '\ufeff'+csv, 'text/csv');
  };
  $('#bFile').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const j = JSON.parse(rd.result);
        const r = j.ranking || j;
        if(!confirm('Isto substitui TODOS os dados atuais pelo backup. Continuar?')) return;
        db.ref('ranking').set({state: r.state || {}, adj: r.adj || {}}).then(() => alert('Backup restaurado.')).catch(erroEscrita);
      }catch(err){ alert('Arquivo inválido.'); }
    };
    rd.readAsText(f);
  };
}
function baixar(nome, txt, tipo){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type:tipo}));
  a.download = nome; document.body.appendChild(a); a.click(); a.remove();
}

function render(){
  if(!user && ['lanc','adj','bkp'].includes(curTab)) curTab = 'ranking';
  renderTabs(); renderAuth();
  ['ranking','lanc','adj','bkp'].forEach(k => $('#v-'+k).classList.add('hidden'));
  if(curTab === 'ranking'){ $('#v-ranking').classList.remove('hidden'); renderRanking(); }
  else if(curTab === 'quadro'){ $('#v-ranking').classList.remove('hidden'); renderQuadro(); }
  else { $('#v-'+curTab).classList.remove('hidden'); ({lanc:renderLanc, adj:renderAdj, bkp:renderBkp})[curTab](); }
}

function init(){
  renderAviso();
  firebase.initializeApp(CONFIG.firebase);
  db = firebase.database(); auth = firebase.auth();
  db.ref('.info/connected').on('value', s => {
    $('#dot').classList.toggle('on', !!s.val());
    $('#conn').textContent = s.val() ? 'ao vivo' : 'sem conexão';
  });
  db.ref('ranking').on('value', s => {
    const v = s.val() || {};
    state = v.state || {}; adj = v.adj || {};
    render();
  }, err => { $('#conn').textContent = 'erro de leitura'; console.error(err); });
  auth.onAuthStateChanged(u => { user = u; render(); });
  render();
}
init();
</script>
</body>
</html>
